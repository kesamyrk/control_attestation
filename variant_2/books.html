<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Книги</title>
</head>
<body>
    <h1>Книги</h1>

    <form method="get" action="{{ url_for('books') }}">
        <input type="text" name="author" value="{{ author }}" placeholder="Автор">
        <button type="submit">Найти</button>
        <a href="{{ url_for('books') }}">Все книги</a>
    </form>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    {% if books %}
        <table border="1" cellpadding="4">
            <tr><th>id</th><th>Название</th><th>Автор</th><th>Год</th></tr>
            {% for b in books %}
                <tr><td>{{ b[0] }}</td><td>{{ b[1] }}</td><td>{{ b[2] }}</td><td>{{ b[3] }}</td></tr>
            {% endfor %}
        </table>
    {% else %}
        <p>Книг не найдено.</p>
    {% endif %}
</body>
</html>
